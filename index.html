<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tomylove</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Settings. Override MESSAGE in the URL: index.html?msg=happy%20birthday
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const MESSAGE = params.has('msg') ? params.get('msg') : 'for you';
const SIGNATURE = 'tomylove · 2026';
const SHOW_HUD = params.get('hud') !== '0';   // index.html?hud=0 hides the small status text

const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
const ease = u => u * (2 - u) * 0.55 + u * u * (3 - 2 * u) * 0.45;
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function norm3(x, y, z) { const l = Math.hypot(x, y, z) || 1; return [x / l, y / l, z / l]; }

// timeline (seconds): wrapping paper draws itself, ribbon ties, flowers appear as buds, then bloom
const DRAW0 = 0.3, DRAW1 = 6.3, O_MAX = 2.0;
const BLOOM0 = 6.0, BLOOM_LEN = 6.5;
const SWAY0 = 8.0, MSG_T = 14.5;

// world: y up, +z toward the viewer
const WAIST_Y = -0.60;
const TILT = 0.16;
const FONT = '"JetBrains Mono","Cascadia Mono",Menlo,Consolas,"Courier New",monospace';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d');
const glowCv = document.createElement('canvas'), gctx = glowCv.getContext('2d');

let W, H, DPR, rows, cols, cellW, cellH, S, CX, CY, N;
let depth, idb, lumb, matb, tintb, glowb, ribb;
let stat = null, statN = 0;
let stars = [], glints = [], sparks = [], stones = [], shooters = [];
// timeline: tl runs forward (dir = 1) or rewinds (dir = -1); a click flips the direction
const T0 = performance.now();
let tl = 0, dir = 1, lastNow = T0, fps = 30;
const realT = () => (performance.now() - T0) / 1000;
const filled = [];

// ---------------------------------------------------------------------------
// materials: colour at tint 0 (a) and tint 1 (b) as [hue, sat, light-dark, light-bright]
// ---------------------------------------------------------------------------
const MATS = [
  null,
  { a: [338, 88, 38, 64], b: [346, 82, 50, 76] },                 // 1 rose, deep pink
  { a: [342, 58, 64, 86], b: [352, 45, 78, 97] },                 // 2 rose, pale pink
  { a: [330, 22, 84, 97], b: [332, 95, 58, 74] },                 // 3 lily: white -> pink
  { a: [132, 62, 30, 60], b: [86, 72, 48, 82] },                  // 4 green -> yellow-green
  { a: [95, 45, 63, 92], b: [95, 45, 63, 92], line: 1 },          // 5 stamen
  { a: [6, 72, 34, 54], b: [6, 72, 34, 54], dot: 1 },             // 6 anther
  { a: [215, 8, 36, 66], b: [215, 6, 44, 74], paper: 1 },         // 7 grey wrapping paper
  { a: [35, 10, 50, 80], b: [35, 8, 60, 88], paper: 1 },          // 8 white wrapping paper
  { a: [44, 45, 68, 97], b: [44, 30, 80, 97] },                   // 9 cream ribbon
  { a: [10, 82, 62, 86], b: [10, 82, 62, 86], dot: 1 },           // 10 coral filler
  { a: [0, 0, 82, 97], b: [0, 0, 82, 97], dot: 1 },               // 11 white filler
  { a: [125, 55, 42, 70], b: [100, 60, 52, 78], line: 1 },        // 12 greenery line
];
const IS_LINE = new Uint8Array(MATS.length), IS_DOT = new Uint8Array(MATS.length), IS_PAPER = new Uint8Array(MATS.length);
MATS.forEach((m, i) => { if (!m) return; IS_LINE[i] = m.line | 0; IS_DOT[i] = m.dot | 0; IS_PAPER[i] = m.paper | 0; });

// ---------------------------------------------------------------------------
// layout
// ---------------------------------------------------------------------------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [cv, off]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
  glowCv.width = Math.max(1, Math.round(W / 4)); glowCv.height = Math.max(1, Math.round(H / 4));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  octx.setTransform(DPR, 0, 0, DPR, 0, 0);

  rows = Math.round(clamp(H / 7.5, 60, 140));
  cellH = H / rows; cellW = cellH * 0.6;
  // narrow (phone) screens: keep at least ~125 letters across so the bouquet stays detailed
  if (W / cellW < 125) { cellW = W / 125; cellH = cellW / 0.6; rows = Math.min(230, Math.ceil(H / cellH)); }
  cols = Math.ceil(W / cellW);
  N = cols * rows;
  S = Math.min(H / 2.75, W / 2.2);
  CX = W / 2; CY = H * 0.5 - 0.12 * S;   // keeps the bouquet centred on tall phone screens

  depth = new Float32Array(N); idb = new Int16Array(N); lumb = new Float32Array(N);
  matb = new Uint8Array(N); tintb = new Uint8Array(N); glowb = new Float32Array(N); ribb = new Uint8Array(N);
  buildStatic();
  makeSky();
}
// samples needed so a surface of this world length leaves no holes in the grid
const dens = (len, horiz) => Math.ceil(len * S / (horiz ? cellW : cellH) * 1.5) + 2;

// ---------------------------------------------------------------------------
// generic surface / line / blob samplers. They hand every sample to a sink:
// sink(x,y,z, nx,ny,nz, order, id, mat, shade, tint, tx,ty,tz)
// ---------------------------------------------------------------------------
let pg = new Float32Array(0);
let M_o = 0, M_sh = 1, M_ti = 0;

function xf(F, x, y, z, out, o, norm) {
  const k = norm ? 1 : F.k;
  out[o]     = (norm ? 0 : F.p[0]) + k * (x * F.r[0] + y * F.u[0] + z * F.f[0]);
  out[o + 1] = (norm ? 0 : F.p[1]) + k * (x * F.r[1] + y * F.u[1] + z * F.f[1]);
  out[o + 2] = (norm ? 0 : F.p[2]) + k * (x * F.r[2] + y * F.u[2] + z * F.f[2]);
}
const TMP = new Float32Array(6);

function surf(ns, nv, ptFn, metaFn, F, id, mat, sink) {
  const need = (ns + 1) * (nv + 1) * 3;
  if (pg.length < need) pg = new Float32Array(Math.ceil(need * 1.5));
  for (let i = 0; i <= ns; i++) for (let j = 0; j <= nv; j++) ptFn(i / ns, j / nv * 2 - 1, (i * (nv + 1) + j) * 3);
  for (let i = 0; i <= ns; i++) {
    const i0 = i > 0 ? i - 1 : 0, i1 = i < ns ? i + 1 : ns;
    for (let j = 0; j <= nv; j++) {
      const j0 = j > 0 ? j - 1 : 0, j1 = j < nv ? j + 1 : nv;
      const A = (i1 * (nv + 1) + j) * 3, B = (i0 * (nv + 1) + j) * 3;
      const C = (i * (nv + 1) + j1) * 3, D = (i * (nv + 1) + j0) * 3;
      const ux = pg[A] - pg[B], uy = pg[A + 1] - pg[B + 1], uz = pg[A + 2] - pg[B + 2];
      const vx = pg[C] - pg[D], vy = pg[C + 1] - pg[D + 1], vz = pg[C + 2] - pg[D + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
      const k = (i * (nv + 1) + j) * 3;
      metaFn(i / ns, j / nv * 2 - 1);
      if (F) {
        xf(F, pg[k], pg[k + 1], pg[k + 2], TMP, 0, false); xf(F, nx, ny, nz, TMP, 3, true);
        sink(TMP[0], TMP[1], TMP[2], TMP[3], TMP[4], TMP[5], M_o, id, mat, M_sh, M_ti, 0, 0, 0);
      } else sink(pg[k], pg[k + 1], pg[k + 2], nx, ny, nz, M_o, id, mat, M_sh, M_ti, 0, 0, 0);
    }
  }
}

const LP = new Float32Array(3), LT = new Float32Array(3);
function line(n, fn, F, id, mat, order0, order1, tint, sink) {
  for (let i = 0; i <= n; i++) {
    const s = i / n;
    fn(s, LP); const x = LP[0], y = LP[1], z = LP[2];
    fn(Math.min(1, s + 0.01), LT); let tx = LT[0] - x, ty = LT[1] - y, tz = LT[2] - z;
    if (s >= 1) { fn(0.99, LT); tx = x - LT[0]; ty = y - LT[1]; tz = z - LT[2]; }
    if (F) {
      xf(F, x, y, z, TMP, 0, false); xf(F, tx, ty, tz, TMP, 3, true);
      sink(TMP[0], TMP[1], TMP[2], 0, 0, 1, lerp(order0, order1, s), id, mat, 1, tint, TMP[3], TMP[4], TMP[5]);
    } else sink(x, y, z, 0, 0, 1, lerp(order0, order1, s), id, mat, 1, tint, tx, ty, tz);
  }
}

function blob(cx, cy, cz, rad, F, id, mat, order, tint, sink) {
  const wr = F ? rad * F.k : rad;
  const nt = Math.max(6, dens(wr * 3, true)), np = Math.max(4, dens(wr * 2));
  for (let i = 0; i <= np; i++) {
    const ph = i / np * Math.PI;
    for (let j = 0; j < nt; j++) {
      const th = j / nt * TAU;
      const nx = Math.sin(ph) * Math.cos(th), ny = Math.cos(ph), nz = Math.sin(ph) * Math.sin(th);
      if (F) {
        xf(F, cx + nx * rad, cy + ny * rad, cz + nz * rad, TMP, 0, false); xf(F, nx, ny, nz, TMP, 3, true);
        sink(TMP[0], TMP[1], TMP[2], TMP[3], TMP[4], TMP[5], order, id, mat, 1, tint, 0, 0, 0);
      } else sink(cx + nx * rad, cy + ny * rad, cz + nz * rad, nx, ny, nz, order, id, mat, 1, tint, 0, 0, 0);
    }
  }
}

// ---------------------------------------------------------------------------
// wrapping paper: sheets of a cone flaring up from the tied waist
// ---------------------------------------------------------------------------
const SHEETS = [
  // grey outer sheet behind: rises to two points at the sides, higher on the right
  { id: 1, mat: 7, th0: -Math.PI / 2, span: 3.5, rMul: 1.00, o0: 0.22, o1: 0.62,
    edge: v => 0.70 + 0.34 * Math.pow(Math.abs(v), 1.4) + 0.10 * v },
  // white inner sheet: one tall point, left of centre
  { id: 2, mat: 8, th0: -Math.PI / 2 - 0.15, span: 2.6, rMul: 0.90, o0: 0.26, o1: 0.66,
    edge: v => 0.98 - 0.42 * Math.pow(Math.abs(v - 0.25), 1.1) },
  // grey front folds crossing diagonally
  { id: 3, mat: 7, th0: Math.PI / 2 + 0.80, span: 1.9, rMul: 1.06, o0: 0.66, o1: 0.92,
    edge: v => 0.24 + 0.13 * v + 0.07 * Math.pow(Math.abs(v), 2) },
  { id: 4, mat: 7, th0: Math.PI / 2 - 0.80, span: 1.9, rMul: 1.10, o0: 0.70, o1: 0.96,
    edge: v => 0.22 - 0.14 * v + 0.07 * Math.pow(Math.abs(v), 2) },
];
const paperR = (s, th) => (0.10 + 0.92 * Math.pow(s, 1.15) + 0.10 * Math.pow(s, 4)) * (1 + 0.035 * Math.sin(3 * th + 4 * s));
function sheetPos(sh, s01, v, out, o) {
  const s = s01 * sh.edge(v);
  const th = sh.th0 + v * sh.span / 2;
  const r = paperR(s, th) * sh.rMul;
  out[o] = r * Math.cos(th) + 0.15 * s * s; out[o + 1] = WAIST_Y + 1.55 * s; out[o + 2] = r * Math.sin(th);
  return s;
}

// ---------------------------------------------------------------------------
// static geometry: paper, ribbon bow, greenery, fillers (built once per resize)
// ---------------------------------------------------------------------------
const STRIDE = 14;
function buildStatic() {
  const P = [];
  const sink = (x, y, z, nx, ny, nz, o, id, mat, sh, ti, tx, ty, tz) => P.push(x, y, z, nx, ny, nz, o, id, mat, sh, ti, tx, ty, tz);

  // lower wrap below the ribbon (drawn first, from the bottom up)
  surf(dens(0.9), dens(1.6, true), (s01, v, k) => {
    const th = v * Math.PI;
    const s = s01 * (1 - 0.2 * (0.5 + 0.5 * Math.sin(2 * th + 1)));
    const r = 0.10 + 0.03 * s + 0.17 * Math.pow(s, 2.5);
    pg[k] = r * Math.cos(th) + 0.03 * s; pg[k + 1] = WAIST_Y - 0.68 * s; pg[k + 2] = r * Math.sin(th);
  }, (s01) => { M_o = (1 - s01) * 0.22; M_sh = 0.85; M_ti = 0.3; }, null, 5, 7, sink);

  // the sheets
  for (const sh of SHEETS) {
    surf(dens(1.7), dens(sh.span * 1.05, true), (s01, v, k) => { sheetPos(sh, s01, v, pg, k); },
      (s01) => { M_o = lerp(sh.o0, sh.o1, s01); M_sh = 0.8 + 0.2 * s01; M_ti = s01; }, null, sh.id, sh.mat, sink);
  }

  // ribbon: band around the waist
  surf(4, dens(0.8, true), (w01, v, k) => {
    const th = v * Math.PI;
    pg[k] = 0.115 * Math.cos(th); pg[k + 1] = WAIST_Y + 0.03 * (w01 * 2 - 1); pg[k + 2] = 0.115 * Math.sin(th);
  }, () => { M_o = 1.0; M_sh = 1; M_ti = 0.3; }, null, 6, 9, sink);

  const K = [0, WAIST_Y, 0.13];
  // bow loops
  [1, -1].forEach((sg, li) => {
    surf(dens(0.9, true), 5, (p01, w, k) => {
      const ph = p01 * TAU;
      const cx = sg * 0.17 * (1 - Math.cos(ph)), cy = 0.08 * Math.sin(ph) + 0.03 * (1 - Math.cos(ph)), cz = 0.04 * (1 - Math.cos(ph));
      const d = norm3(cx - sg * 0.17, cy - 0.03, cz - 0.04);
      const wd = norm3(d[0] * 0.8, d[1] * 0.8, d[2] * 0.8 + 0.6);
      pg[k] = K[0] + cx + wd[0] * 0.035 * w; pg[k + 1] = K[1] + cy + wd[1] * 0.035 * w; pg[k + 2] = K[2] + cz + wd[2] * 0.035 * w;
    }, (p01) => { M_o = 1.02 + 0.12 * p01; M_sh = 1; M_ti = 0.5 + 0.5 * Math.sin(p01 * Math.PI); }, null, 7 + li, 9, sink);
  });
  // bow tails (twisting organza)
  [[1, 0.78], [-1, 0.62]].forEach(([sg, len], li) => {
    surf(dens(len), 6, (s, w, k) => {
      const tw = s * 3.5 + (sg > 0 ? 0 : 1.3);
      const wd = norm3(Math.cos(tw), 0.15, Math.sin(tw));
      const cx = sg * (0.05 * s + 0.10 * Math.sin(s * 3)), cy = -len * s, cz = 0.04 * s + 0.04 * Math.sin(s * 4);
      pg[k] = K[0] + cx + wd[0] * 0.04 * w; pg[k + 1] = K[1] + cy + wd[1] * 0.04 * w; pg[k + 2] = K[2] + cz + wd[2] * 0.04 * w;
    }, (s) => { M_o = 1.05 + 0.15 * s; M_sh = 1; M_ti = s; }, null, 9 + li, 9, sink);
  });
  blob(K[0], K[1], K[2] + 0.01, 0.042, null, 11, 9, 1.0, 0.6, sink);

  // greenery sprigs poking out between the flowers
  const R = rng(7);
  const SPRIGS = [
    [-0.36, 0.02, 0.30, -1, 0.5, 0.3, 0.30], [-0.12, -0.30, 0.42, -0.7, -0.8, 0.4, 0.22],
    [0.36, -0.26, 0.36, 1, -0.45, 0.3, 0.26], [0.42, 0.02, 0.30, 1, 0.35, 0.2, 0.22],
    [-0.26, 0.36, 0.14, -0.5, 1, 0, 0.26], [0.30, 0.40, 0.10, 0.6, 1, 0, 0.20],
    [-0.42, 0.22, 0.20, -1, 0.2, 0.1, 0.20],
  ];
  SPRIGS.forEach(([bx0, by, bz, dx, dy, dz, L0], si) => {
    const bx = bx0 * 1.3, L = L0 * 1.3;
    const d = norm3(dx, dy, dz), id = 12 + si;
    const at = (s, o) => { o[0] = bx + d[0] * L * s; o[1] = by + d[1] * L * s - 0.06 * L * s * s; o[2] = bz + d[2] * L * s; };
    line(dens(L), at, null, id, 12, 1.22, 1.34, 0, sink);
    const side = norm3(-d[1], d[0], 0.3);
    for (let q = 1; q <= 7; q++) {
      const s = q / 8, sg = q % 2 ? 1 : -1, ll = 0.05 * (1 - s * 0.5);
      at(s, LP); const ox = LP[0], oy = LP[1], oz = LP[2];
      line(4, (u, o) => { o[0] = ox + (side[0] * sg + d[0] * 0.6) * ll * u; o[1] = oy + (side[1] * sg + d[1] * 0.6) * ll * u; o[2] = oz + side[2] * ll * u; },
        null, id, 4, 1.25 + s * 0.1, 1.27 + s * 0.1, s, sink);
    }
  });

  // little filler blossoms (coral + white)
  const FILL = [[-0.40, 0.12, 0.28, 10], [-0.33, 0.27, 0.22, 10], [-0.20, -0.14, 0.40, 11], [0.30, -0.08, 0.40, 11], [-0.47, 0.30, 0.15, 10]];
  FILL.forEach(([fx, fy, fz, m], fi) => {
    for (let q = 0; q < 7; q++) {
      const a = R() * TAU, rr = 0.02 + R() * 0.05;
      blob(fx * 1.3 + Math.cos(a) * rr, fy + Math.sin(a) * rr, fz + (R() - 0.5) * 0.04, 0.02 + R() * 0.008, null, 20 + fi, m, 1.26 + q * 0.01, 0, sink);
    }
  });

  stat = new Float32Array(P);
  statN = P.length / STRIDE;

  // rhinestones glued on the paper
  stones = [];
  const RS = rng(21);
  const pick = [[1, 22], [2, 30], [3, 8], [4, 8]];
  for (const [sid, n] of pick) {
    const sh = SHEETS[sid - 1];
    for (let q = 0; q < n; q++) {
      const s01 = 0.42 + RS() * 0.55, v = RS() * 1.8 - 0.9, p = new Float32Array(3);
      sheetPos(sh, s01, v, p, 0);
      stones.push({ p, id: sid, order: lerp(sh.o0, sh.o1, s01), ph: RS() * TAU, sp: 1.5 + RS() * 3.5,
                    col: RS() < 0.4 ? '255,190,215' : '255,255,255' });
    }
  }
}

// ---------------------------------------------------------------------------
// flowers (rebuilt every frame so they can bloom)
// ---------------------------------------------------------------------------
function frameOf(p, ax, k, spin) {
  const u = norm3(...ax);
  const ref = Math.abs(u[1]) < 0.95 ? [0, 1, 0] : [1, 0, 0];
  let r = norm3(ref[1] * u[2] - ref[2] * u[1], ref[2] * u[0] - ref[0] * u[2], ref[0] * u[1] - ref[1] * u[0]);
  let f = [u[1] * r[2] - u[2] * r[1], u[2] * r[0] - u[0] * r[2], u[0] * r[1] - u[1] * r[0]];
  const c = Math.cos(spin), s = Math.sin(spin);
  const r2 = [r[0] * c + f[0] * s, r[1] * c + f[1] * s, r[2] * c + f[2] * s];
  const f2 = [f[0] * c - r[0] * s, f[1] * c - r[1] * s, f[2] * c - r[2] * s];
  return { p, u, r: r2, f: f2, k };
}

const FLOWERS = [
  { type: 'rose', mat: 1, p: [-0.18, 0.04, 0.38], ax: [-0.20, 0.85, 0.50], k: 0.56, d: 0.0, spin: 0.3 },
  { type: 'rose', mat: 2, p: [0.02, -0.20, 0.48], ax: [0.10, 0.80, 0.60], k: 0.48, d: 0.6, spin: 1.1 },
  { type: 'rose', mat: 2, p: [-0.38, 0.30, 0.20], ax: [-0.45, 0.85, 0.30], k: 0.42, d: 1.0, spin: 2.0 },
  { type: 'lily', p: [0.32, 0.02, 0.46], ax: [0.35, 0.25, 0.90], k: 0.95, d: 0.3, spin: 0.2 },
  { type: 'lily', p: [0.06, 0.38, 0.28], ax: [0.0, 0.40, 0.92], k: 0.80, d: 0.9, spin: 0.5 },
  { type: 'bud', p: [0.16, 0.55, 0.08], ax: [-0.06, 1, 0.12], k: 1.15, d: 0, spin: 0 },
];
{
  let nid = 100;
  FLOWERS.forEach((fl, i) => { fl.F = frameOf(fl.p, fl.ax, fl.k, fl.spin); fl.id0 = nid; nid += 40; fl.o = 1.32 + i * 0.06; });
}

// rose: nested layers of curved petals (local coords, base at origin, axis +y)
const LAYERS = [{ n: 3, f: 0 }, { n: 4, f: 0.22 }, { n: 5, f: 0.45 }, { n: 5, f: 0.7 }, { n: 6, f: 1 }];
const ROSE_PETALS = [];
LAYERS.forEach((L, li) => { for (let k = 0; k < L.n; k++) ROSE_PETALS.push({ f: L.f, a: k / L.n * TAU + li * 0.9, hw: Math.PI / L.n * 1.2, seed: ROSE_PETALS.length * 1.7 }); });

function drawRose(fl, b, sink) {
  b *= 0.72; // bouquet roses stay cupped
  ROSE_PETALS.forEach((p, pi) => {
    const f = p.f;
    const alpha = lerp(0.62 + 0.13 * f, 0.10 + 1.10 * f, b);
    const beta = lerp(-1.35 - 0.25 * f, 0.25 + 0.55 * f, b);
    const Lp = lerp(0.30 + 0.16 * f, 0.38 + 0.30 * f, b);
    const r0 = 0.02 + 0.05 * f, ca = Math.cos(alpha), sa = Math.sin(alpha);
    const ns = dens(Lp * fl.k), nv = dens((0.3 + 0.9 * f * (0.4 + 0.6 * b)) * fl.k, true);
    surf(ns, nv, (u, v, k) => {
      const bu = alpha + beta * u;

      if (Math.abs(beta) < 1e-3) { r = r0 + Lp * u * sa; y = Lp * u * ca; }
      else { r = r0 + Lp * (ca - Math.cos(bu)) / beta; y = Lp * (Math.sin(bu) - sa) / beta; }

      const vv = v * v;

      y += -(0.05 + 0.04 * b) * Lp * vv * u * u + 0.012 * Math.sin(v * 5 + p.seed) * u * u * u * b;
      const th = p.a + v * span;
      pg[k] = r * Math.cos(th); pg[k + 1] = y; pg[k + 2] = r * Math.sin(th);
    }, (u) => { M_o = fl.o + u * 0.2 + (1 - f) * 0.05; M_sh = (0.5 + 0.5 * u) * (0.72 + 0.28 * f); M_ti = u * 0.85; },
    fl.F, fl.id0 + pi, fl.mat, sink);

}

// lily: six long pointed petals that recurve as it opens, white edges with a pink heart
function drawLily(fl, b, sink) {
  for (let q = 0; q < 6; q++) {
    const az = q * Math.PI / 3, inner = q % 2 === 1;
    const alpha = lerp(0.12, inner ? 1.0 : 1.15, b), beta = lerp(-0.15, inner ? 0.9 : 1.1, b);
    const Lp = inner ? 0.50 : 0.56, wMax = (inner ? 0.09 : 0.075) * lerp(0.8, 1, b);
    const ca = Math.cos(alpha), sa = Math.sin(alpha), cz = Math.cos(az), sz = Math.sin(az);
    surf(dens(Lp * fl.k), dens(wMax * 2.2 * fl.k, true) + 2, (s, w, k) => {
      const bu = alpha + beta * s;
      let r, y;
      if (Math.abs(beta) < 1e-3) { r = 0.025 + Lp * s * sa; y = Lp * s * ca; }
      else { r = 0.025 + Lp * (ca - Math.cos(bu)) / beta; y = Lp * (Math.sin(bu) - sa) / beta; }
      const wd = wMax * Math.pow(Math.sin(Math.PI * s), 0.7) * (1 - 0.3 * s);
      y += 0.02 * (1 - w * w) * Math.sin(Math.PI * s) * b;

    }, (s, w) => { M_o = fl.o + s * 0.2; M_sh = 0.65 + 0.35 * s; M_ti = clamp(Math.pow(1 - s, 0.5) * (1 - 0.7 * Math.abs(w)) * 1.5, 0, 1); },
    fl.F, fl.id0 + q, 3, sink);
  }
  if (b < 0.15) return;
  const g = smooth((b - 0.15) / 0.5);
  for (let q = 0; q < 6; q++) {
    const az = q * Math.PI / 3 + Math.PI / 6, cz = Math.cos(az), sz = Math.sin(az);
    const end = new Float32Array(3);
    const at = (s, o) => { const r = 0.03 + 0.26 * s * g, y = (0.05 + 0.36 * s - 0.10 * s * s) * lerp(0.5, 1, g); o[0] = r * cz; o[1] = y; o[2] = r * sz; };
    line(dens(0.4 * fl.k), at, fl.F, fl.id0 + 10 + q, 5, fl.o + 0.15, fl.o + 0.22, 0, sink);
    at(1, end);
    blob(end[0], end[1], end[2], 0.026, fl.F, fl.id0 + 20 + q, 6, fl.o + 0.22, 0, sink);
  }
  line(dens(0.45 * fl.k), (s, o) => { o[0] = 0.03 * s * s; o[1] = 0.05 + 0.40 * s * lerp(0.5, 1, g); o[2] = 0; },
    fl.F, fl.id0 + 30, 12, fl.o + 0.15, fl.o + 0.22, 1, sink);
}

// the tall closed lily bud (green, yellowing toward the tip)
function drawBud(fl, sink) {
  surf(dens(0.45), dens(0.25, true), (s, v, k) => {
    const th = v * Math.PI, r = 0.068 * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.7)), 0.9) * (1 - 0.2 * s);
    pg[k] = r * Math.cos(th); pg[k + 1] = 0.45 * s; pg[k + 2] = r * Math.sin(th);
  }, (s) => { M_o = fl.o + s * 0.2; M_sh = 0.8 + 0.2 * s; M_ti = s; }, fl.F, fl.id0, 4, sink);
  line(dens(0.3), (s, o) => { o[0] = 0; o[1] = -0.3 * (1 - s); o[2] = 0; }, fl.F, fl.id0 + 1, 12, fl.o - 0.05, fl.o, 0, sink);

// ---------------------------------------------------------------------------
// projection + z-buffer splatting
// ---------------------------------------------------------------------------
let cS, sS, cT, sT, head, LX, LY, LZ, RX, RY, RZ;
let lightX = 0, lightY = 0, lightN = 0;

function project(x, y, z, out) {
  const X = x * cS + z * sS, Z0 = -x * sS + z * cS;
  const Y = y * cT - Z0 * sT, Z = y * sT + Z0 * cT;
  const ps = 1 / (1 - Z * 0.12);
  out[0] = CX + X * S * ps; out[1] = CY - Y * S * ps; out[2] = Z;
}
const PJ = new Float32Array(3);

function splat(x, y, z, nx, ny, nz, order, id, mat, shade, tint, tx, ty, tz) {
  if (order > head || head <= 0) return;
  const X = x * cS + z * sS, Z0 = -x * sS + z * cS;
  const Y = y * cT - Z0 * sT, Z = y * sT + Z0 * cT;
  const ps = 1 / (1 - Z * 0.12);
  const px = CX + X * S * ps, py = CY - Y * S * ps;
  if (px < 0 || py < 0) return;
  const c = (px / cellW) | 0, r = (py / cellH) | 0;
  if (c >= cols || r >= rows) return;
  const age = head - order;
  if (age < 0.02 && head < O_MAX) { lightX += px; lightY += py; lightN++; }
  const i = r * cols + c;
  if (Z <= depth[i]) return;
  depth[i] = Z;
  let NX = nx * cS + nz * sS; const NZ0 = -nx * sS + nz * cS;
  let NY = ny * cT - NZ0 * sT, NZ = ny * sT + NZ0 * cT;
  let back = false;
  if (NZ < 0) { NX = -NX; NY = -NY; NZ = -NZ; back = true; }
  let lum = 0.18 + 0.85 * Math.max(0, NX * LX + NY * LY + NZ * LZ)
          + 0.35 * Math.pow(Math.max(0, NX * RX + NY * RY + NZ * RZ), 2);
  lum *= shade; if (back) lum *= IS_PAPER[mat] ? 0.85 : 0.78;
  lumb[i] = lum; idb[i] = id; matb[i] = mat;
  tintb[i] = (tint * 4 + 0.5) | 0;
  glowb[i] = Math.exp(-age / 0.035);
  if (IS_LINE[mat]) {
    const TX = tx * cS + tz * sS, TZ0 = -tx * sS + tz * cS, TY = ty * cT - TZ0 * sT;
    ribb[i] = dirChar(TX, -TY);
  }
}

// ---------------------------------------------------------------------------
// characters + colour
// ---------------------------------------------------------------------------
const DIR = ['-', '\\', '|', '/'];
function dirChar(dx, dy) {
  let a = Math.atan2(dy, dx); if (a < 0) a += Math.PI; a = a * 180 / Math.PI;
  if (a < 22.5 || a >= 157.5) return 0;
  if (a < 67.5) return 1;
  if (a < 112.5) return 2;
  return 3;
}
const RAMP = [
  ['.', '`', "'", ','], [':', '-', '~', ';'], ['+', '=', 'r', 'c', 'v', '<', '>'],
  ['x', 'z', 'j', 'f', 't', 'u', 'n', '(', ')'], ['o', 'a', 'e', '0', 'Q', '[', ']', '{', '}'], ['8', '&', '%', '$', 'B', '@', '#'],
];
const PAPER_RAMP = [['.'], ['.', '`'], ['.', ':', ','], [':', '-', '.'], ['-', '~', ':'], ['=', '~', '-']];
const DOT_RAMP = ['*', 'o', '@', '%', '&', '8', 'o', '*'];

const colCache = new Map();
function colour(m, tq, lvl, edge, gl) {
  const key = ((((m * 5 + tq) * 12 + lvl) * 2 + edge) * 10) + gl;
  let s = colCache.get(key);
  if (s) return s;
  const M = MATS[m], t = tq / 4;
  const h = lerp(M.a[0], M.b[0], t), sat = lerp(M.a[1], M.b[1], t);
  let l = lerp(lerp(M.a[2], M.b[2], t), lerp(M.a[3], M.b[3], t), lvl / 11) + (edge ? 9 : 0);
  const g = gl / 9;
  s = `hsl(${Math.round(h)},${Math.round(lerp(sat, Math.min(sat, 30), g))}%,${Math.round(clamp(lerp(l, 96, g), 0, 98))}%)`;
  colCache.set(key, s);
  return s;
}

// ---------------------------------------------------------------------------
// sky: lots of twinkling stars, rotating four-point glints, shooting stars
// ---------------------------------------------------------------------------
const STAR_COLS = ['255,255,255', '205,225,255', '255,214,232', '255,240,205'];
function newGlint(g, t) {
  g.x = Math.random() * W; g.y = Math.random() * H * 0.93;
  g.s = 7 + Math.pow(Math.random(), 2) * 30; g.t0 = t + Math.random() * 1.6; g.dur = 0.7 + Math.random() * 1.6;
  g.rot = Math.random() * 0.8; g.spin = (Math.random() - 0.5) * 1.2;
  g.col = STAR_COLS[(Math.random() * STAR_COLS.length) | 0];
  return g;
}
function makeSky() {
  stars = []; glints = []; shooters = [];
  const n = Math.round(cols * rows / 28);
  for (let k = 0; k < n; k++) {
    const r = Math.random();
    stars.push({
      x: Math.floor(Math.random() * cols) * cellW, y: Math.floor(Math.random() * rows) * cellH,
      ch: r < 0.65 ? '.' : r < 0.85 ? '·' : '+',
      ph: Math.random() * TAU, sp: 1.2 + Math.random() * 4.5, pw: 2 + Math.random() * 5,
      t0: 0.4 + Math.random() * 4.5, b: 0.4 + Math.random() * 0.6,
      col: STAR_COLS[Math.random() < 0.55 ? 0 : (1 + Math.random() * 3) | 0],
    });
  }
  const gn = Math.round(clamp(W * H / 26000, 16, 48));
  for (let k = 0; k < gn; k++) { const g = newGlint({}, realT() + Math.random() * 3); glints.push(g); }
}

function drawGlint(x, y, size, a, c, rot = 0) {
  if (a <= 0.01) return;
  ctx.lineWidth = 1;
  for (let q = 0; q < 8; q++) {
    const ang = rot + q * Math.PI / 4, m = q % 2 ? 0.42 : 1, L = size * m;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const gr = ctx.createLinearGradient(x, y, x + dx * L, y + dy * L);
    gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`);
    ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx * L, y + dy * L); ctx.stroke();
  }
  const rg = ctx.createRadialGradient(x, y, 0, x, y, size * 0.3);
  rg.addColorStop(0, `rgba(${c},${a})`); rg.addColorStop(1, `rgba(${c},0)`);
  ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, size * 0.3, 0, TAU); ctx.fill();
}

// is this screen point on (or right next to) the bouquet? background sparkle stays off it
function onBouquet(x, y, pad) {
  const c0 = Math.floor(x / cellW), r0 = Math.floor(y / cellH), pc = Math.ceil(pad / cellW), pr = Math.ceil(pad / cellH);
  for (let r = r0 - pr; r <= r0 + pr; r++) {
    if (r < 0 || r >= rows) continue;
    for (let c = c0 - pc; c <= c0 + pc; c++) if (c >= 0 && c < cols && idb[r * cols + c]) return true;
  }
  return false;
}

function drawSky(t, rt, dt) {
  ctx.font = `${cellH * 0.9}px ${FONT}`; ctx.textBaseline = 'top';
  for (const s of stars) {
    const ap = smooth((t - s.t0) / 1.2);
    if (ap <= 0 || onBouquet(s.x, s.y, cellH)) continue;
    const tw = Math.pow(0.5 + 0.5 * Math.sin(rt * s.sp + s.ph), s.pw);
    const a = ap * s.b * (0.12 + 0.88 * tw);
    ctx.fillStyle = `rgba(${s.col},${a.toFixed(3)})`;
    ctx.fillText(tw > 0.85 ? '*' : tw > 0.55 ? '+' : s.ch, s.x, s.y);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const g of glints) {
    if (rt > g.t0 + g.dur) newGlint(g, rt);
    const q = (rt - g.t0) / g.dur;
    if (q <= 0 || onBouquet(g.x, g.y, g.s * 0.8)) continue;
    const a = Math.pow(Math.sin(Math.PI * q), 2) * 0.95;
    drawGlint(g.x, g.y, g.s * (0.5 + 0.5 * a), a, g.col, g.rot + g.spin * (rt - g.t0));
  }
  // shooting stars
  if (t > 3 && Math.random() < dt / 3.5 && shooters.length < 2) {
    const ang = Math.PI * (0.12 + Math.random() * 0.16) * (Math.random() < 0.5 ? 1 : -1);
    const sp = (W + H) * (0.45 + Math.random() * 0.3);
    shooters.push({ x: Math.random() * W, y: Math.random() * H * 0.35, vx: Math.cos(ang) * sp * (ang > 0 ? 1 : -1) * Math.sign(Math.cos(ang)), vy: Math.abs(Math.sin(ang)) * sp, age: 0, life: 0.7 + Math.random() * 0.5 });
  }
  for (let k = shooters.length - 1; k >= 0; k--) {
    const s = shooters[k]; s.age += dt;
    if (s.age > s.life) { shooters.splice(k, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (onBouquet(s.x, s.y, 12)) continue;
    const a = Math.sin(Math.PI * s.age / s.life), L = 0.09;
    const gr = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * L, s.y - s.vy * L);
    gr.addColorStop(0, `rgba(255,255,255,${0.9 * a})`); gr.addColorStop(1, 'rgba(180,210,255,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * L, s.y - s.vy * L); ctx.stroke();
    if (!onBouquet(s.x, s.y, 10)) drawGlint(s.x, s.y, 7, a, '255,255,255');
  }

}

// ---------------------------------------------------------------------------
// frame
// ---------------------------------------------------------------------------
function frame(now) {
  const dt = Math.min(0.1, (now - lastNow) / 1000); lastNow = now;
  if (dt > 0) fps = lerp(fps, 1 / dt, 0.05);
  tl = Math.max(0, tl + dt * dir);
  const t = tl, rt = realT();

  head = clamp((t - DRAW0) / (DRAW1 - DRAW0), 0, 1) * O_MAX;
  const sway = 0.17 * Math.sin(Math.max(t - SWAY0, 0) * 0.35) * smooth((t - SWAY0) / 4);
  cS = Math.cos(sway); sS = Math.sin(sway); cT = Math.cos(TILT); sT = Math.sin(TILT);
  [LX, LY, LZ] = norm3(-0.35, 0.85, 0.65);
  [RX, RY, RZ] = norm3(Math.cos(t * 0.8), 0.4, Math.sin(t * 0.8));

  depth.fill(-1e9); idb.fill(0);
  lightX = lightY = lightN = 0;

  for (let k = 0, o = 0; k < statN; k++, o += STRIDE)
    splat(stat[o], stat[o + 1], stat[o + 2], stat[o + 3], stat[o + 4], stat[o + 5], stat[o + 6],
          stat[o + 7], stat[o + 8], stat[o + 9], stat[o + 10], stat[o + 11], stat[o + 12], stat[o + 13]);

  let bSum = 0, bN = 0;
  for (const fl of FLOWERS) {
    if (head < fl.o - 0.05) continue;
    if (fl.type === 'bud') { drawBud(fl, splat); continue; }
    const b = ease(clamp((t - BLOOM0 - fl.d) / BLOOM_LEN, 0, 1));
    bSum += b; bN++;
    if (fl.type === 'rose') drawRose(fl, b, splat); else drawLily(fl, b, splat);
  }
  const bloomAvg = bN ? bSum / bN : 0;

  // ---- characters into the offscreen layer
  octx.clearRect(0, 0, W, H);
  octx.font = `${cellH < 9 ? 'bold ' : ''}${cellH}px ${FONT}`;
  octx.textBaseline = 'top';
  const buckets = new Map();
  filled.length = 0;
  let letters = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, id = idb[i];
      if (!id) continue;
      const mat = matb[i];
      let ch, edge = 0;
      if (IS_LINE[mat]) ch = DIR[ribb[i]];
      else {
        const z = depth[i];
        let gx = 0, gy = 0, outs = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const rr = r + dy, cc = c + dx;
          let out;
          if (rr < 0 || rr >= rows || cc < 0 || cc >= cols) out = true;
          else { const j = rr * cols + cc; out = idb[j] === 0 || (idb[j] !== id && depth[j] < z - (id >= 100 ? 0.025 : 0.035)); }
          if (out) { gx += dx; gy += dy; outs++; }
        }
        if (IS_DOT[mat]) ch = DOT_RAMP[hash(i, id) % DOT_RAMP.length];
        else if (outs >= 7) ch = '*';
        else if (outs && (gx || gy)) {
          edge = 1;
          if (Math.abs(gy) > 2 * Math.abs(gx)) ch = gy > 0 ? '_' : '-';
          else ch = DIR[dirChar(-gy, gx)];
        } else {
          const lv = clamp(Math.floor(lumb[i] * 6), 0, 5);
          const set = IS_PAPER[mat] ? PAPER_RAMP[lv] : RAMP[lv];
          ch = set[hash(i, id) % set.length];
        }
      }
      const lvl = clamp(Math.round(lumb[i] * 8.5), 0, 11);
      const gl = clamp(Math.round(glowb[i] * 9), 0, 9);
      const col = colour(mat, Math.min(4, tintb[i]), lvl, edge, gl);
      let bk = buckets.get(col); if (!bk) buckets.set(col, bk = []);
      bk.push(ch, c * cellW, r * cellH);
      if (!IS_PAPER[mat]) filled.push(i);
      letters++;
    }
  }
  for (const [col, bk] of buckets) {
    octx.fillStyle = col;
    for (let k = 0; k < bk.length; k += 3) octx.fillText(bk[k], bk[k + 1], bk[k + 2]);
  }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawSky(t, rt, dt);

  gctx.clearRect(0, 0, glowCv.width, glowCv.height);
  gctx.filter = 'blur(2px)';
  gctx.drawImage(off, 0, 0, glowCv.width, glowCv.height);
  gctx.filter = 'none';
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5;
  ctx.drawImage(glowCv, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(off, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  // drawing light + ghost dots + sparks
  if (lightN > 0) {
    const lx = lightX / lightN, ly = lightY / lightN;
    const rg = ctx.createRadialGradient(lx, ly, 0, lx, ly, cellH * 5);
    rg.addColorStop(0, 'rgba(255,255,255,0.85)'); rg.addColorStop(0.25, 'rgba(190,230,255,0.25)'); rg.addColorStop(1, 'rgba(160,210,255,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(lx, ly, cellH * 5, 0, TAU); ctx.fill();
    ctx.font = `${cellH * 0.9}px ${FONT}`;
    const c0 = Math.floor(lx / cellW), r0 = Math.floor(ly / cellH), RC = 14, RR = 8, fr = Math.floor(t * 12);
    for (let r = r0 - RR; r <= r0 + RR; r++) for (let c = c0 - RC; c <= c0 + RC; c++) {
      const d = Math.hypot((c - c0) / RC, (r - r0) / RR);
      if (d > 1 || r < 0 || c < 0) continue;
      const h = hash(r * 977 + c, fr);
      if (h % 4) continue;
      ctx.fillStyle = `rgba(200,215,230,${(0.28 * (1 - d)).toFixed(3)})`;
      ctx.fillText(h % 11 ? '.' : '+', c * cellW, r * cellH);
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  if (MESSAGE && t > MSG_T) {
    const n = Math.min(MESSAGE.length, Math.floor((t - MSG_T) * 9));
    const txt = MESSAGE.slice(0, n) + ((Math.floor(t * 2.5) % 2 && n < MESSAGE.length + 6) ? '_' : ' ');
    const fs = Math.max(16, Math.min(W / (MESSAGE.length + 4) / 0.6, cellH * 2.4));
    ctx.font = `${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,90,120,0.9)'; ctx.shadowBlur = fs * 0.6;
    ctx.fillStyle = '#ff8fa5';
    ctx.fillText(txt, W / 2, H * 0.075);
    ctx.shadowBlur = 0; ctx.textAlign = 'left';
  }

  if (SHOW_HUD) drawHud(t, bloomAvg, sway, letters);
  requestAnimationFrame(frame);
}

function spawnSpark(x, y, power) {
  const a = Math.random() * TAU, sp = (20 + Math.random() * 90) * power;
  sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 25 * power, age: 0, life: 0.5 + Math.random() * 1.1 });
  if (sparks.length > 500) sparks.shift();
}
function drawSparks(dt) {
  ctx.font = `${cellH * 0.9}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  for (let k = sparks.length - 1; k >= 0; k--) {
    const s = sparks[k];
    s.age += dt; if (s.age >= s.life) { sparks.splice(k, 1); continue; }
    s.vx *= 1 - dt * 1.5; s.vy = s.vy * (1 - dt * 1.5) + 18 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const q = s.age / s.life, a = (1 - q) * (1 - q);
    ctx.fillStyle = `rgba(225,240,255,${a.toFixed(3)})`;
    ctx.fillText(q < 0.25 ? '*' : q < 0.5 ? '+' : q < 0.75 ? '·' : '.', s.x, s.y);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
}

function pad(n, w) { return String(n).padStart(w, '0'); }
function drawHud(t, b, sway, letters) {
  const fs = Math.round(clamp(Math.min(W, H) / 60, 10, 13));
  ctx.font = `${fs}px ${FONT}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'right';
  const m = fs * 1.6, lh = fs * 1.35, barY = H - m * 0.7;

  ctx.fillStyle = '#ff6f8f';
  const clock = `t ${pad(Math.min(t, 999).toFixed(2), 5)}s`;
  ctx.fillText(clock, W - m, m * 1.4);
  if ((dir < 0 ? t > 0 : t < 20) && Math.floor(performance.now() / 500) % 2 === 0) {
    const wv = ctx.measureText(clock).width;
    ctx.beginPath(); ctx.arc(W - m - wv - fs * 0.7, m * 1.4 - fs * 0.33, fs * 0.22, 0, TAU); ctx.fill();
  }

  ctx.textAlign = 'left'; ctx.fillStyle = '#7b7b7b';
  let deg = sway * 180 / Math.PI; if (deg < 0) deg += 360;
  const ls = pad(letters, 4);
  ctx.fillText(SIGNATURE, m, barY - lh * 3.6);
  ctx.fillText(`bloom ${pad((b * 100).toFixed(1), 5)}%   sway ${pad(deg.toFixed(2), 6)}°`, m, barY - lh * 2.6);
  ctx.fillText(`letters ${ls.slice(0, -3)},${ls.slice(-3)}`, m, barY - lh * 1.6);

  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(m * 0.5, barY - lh * 0.95, W - m, 1);
  ctx.fillStyle = '#c9c9c9'; ctx.fillText('$ open index.html', m * 0.5, barY);
  ctx.textAlign = 'right'; ctx.fillStyle = '#7b7b7b';
  const tail = dir < 0 ? (t > 0 ? '\u25c0\u25c0 rewinding \u00b7 click to cancel' : 'click to play')
             : (t > MSG_T + 4 ? 'click to rewind' : 'running \u00b7 click to rewind');
  ctx.fillText(`${tail} · ${Math.round(fps)} fps`, W - m * 0.5, barY);
  ctx.textAlign = 'left';
}

function toggle() { dir = -dir; }
function restart() { tl = 0; dir = 1; shooters = []; }
addEventListener('resize', resize);
cv.addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.key === ' ') toggle(); else if (e.key === 'r' || e.key === 'R') restart(); });

resize();
requestAnimationFrame(frame);
})();
</script>
